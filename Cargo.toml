[package]
name = "kiri-md"
version = "0.1.0"
edition = "2024"
description = "Markdown reader for the kitty terminal"
readme = "README.md"
publish = false

[workspace]
members = ["crates/kiri-image-utils"]

[lib]
name = "kiri"

[[bin]]
name = "kiri"
path = "src/main.rs"

# Optional parts of kiri; `full` turns them all on. Without them, kiri
# shows PNG, JPEG, GIF, WebP and SVG images, and draws Mermaid diagrams
# only with an external program such as mermaid-cli's mmdc. `full` adds
# the image formats the `image` crate decodes cheaply (BMP, ICO, TIFF,
# QOI, PNM and TGA), and Mermaid diagrams drawn by kiri itself.
[features]
default = ["full"]
full = [
    "image/bmp",
    "image/ico",
    "image/tiff",
    "image/qoi",
    "image/pnm",
    "image/tga",
    "mermaid",
]
# Mermaid diagrams drawn by kiri itself, through merman with its default
# features: every diagram type, the Cytoscape and ELK layouts and math.
# Its png, native-fonts and system-fonts features would bring in a second
# resvg.
mermaid = ["dep:merman"]

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6", features = ["derive"] }
comrak = { version = "0.56", default-features = false, features = ["shortcodes"] }
csv = "1.4.0"
emojis = "0.9.1"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
kiri-image-utils = { version = "0.1.0", path = "crates/kiri-image-utils" }
libc = "0.2.190"
merman = { version = "0.9.1", optional = true }
resvg = "0.48.1"
rustix = { version = "1.1.5", features = ["termios", "event", "process", "fs", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
signal-hook = "0.4.5"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
insta = "1.49"
# Pseudo-terminals for testing capability detection, and sessions
# without a controlling terminal for testing --doctor.
rustix = { version = "1.1.5", features = ["pty", "process"] }

# Decoding images without optimisation is slow: a 4845 × 2980 JPEG takes
# about 3 s instead of 0.07 s. Debug builds optimise the image decoders, the
# SVG parser and renderer and the fonts and text shaping for SVG text, and
# keep kiri's own code easy to debug. An SVG with 400 lines of text takes
# 0.7 s instead of 1.2 s. The fern as an LZW TIFF takes 0.36 s instead of
# 0.64 s. flate2, moxcms and the TIFF decoder's fax and half made no
# measurable difference.
# Generic code is compiled in the crate that uses it. kiri-image-utils is
# optimised for that reason: it decodes raster images, whose BMP, TGA and
# QOI decoders are generic, and scales them with fast_image_resize, most
# of which is generic. The fern as a BMP takes 0.23 s instead of 1.8 s.
[profile.dev.package]
zune-jpeg.opt-level = 3
zune-core.opt-level = 3
image.opt-level = 3
image-webp.opt-level = 3
png.opt-level = 3
gif.opt-level = 3
tiff.opt-level = 3
weezl.opt-level = 3
fdeflate.opt-level = 3
miniz_oxide.opt-level = 3
simd-adler32.opt-level = 3
crc32fast.opt-level = 3
resvg.opt-level = 3
tiny-skia.opt-level = 3
tiny-skia-path.opt-level = 3
usvg.opt-level = 3
roxmltree.opt-level = 3
svgtypes.opt-level = 3
simplecss.opt-level = 3
kurbo.opt-level = 3
fontdb.opt-level = 3
harfrust.opt-level = 3
skrifa.opt-level = 3
read-fonts.opt-level = 3
font-types.opt-level = 3
fast_image_resize.opt-level = 3
kiri-image-utils.opt-level = 3
