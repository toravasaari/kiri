[package]
name = "kiri-tr-image-utils"
version = "0.1.0"
edition = "2024"
description = "Image code for kiri, a Markdown reader for the kitty terminal, that debug builds optimise"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
fast_image_resize = "6.1.0"
# kiri chooses the other formats; PNG is always among them.
image = { version = "0.25.10", default-features = false, features = ["png"] }
