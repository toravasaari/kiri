name: check

# Runs `make check`, the definition of done, and the tests on macOS on every
# push to master, on pull requests, and by hand from the Actions tab. A push
# to a feature branch alone does not run it; opening a pull request does.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs rustfmt and clippy.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # `make test` uses cargo-nextest, and `make check` runs the licence check
      # with cargo-deny, when they are installed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-about
      - run: make check
      # The third-party notices of a release must be makeable: this fails when
      # a dependency brings a licence file that cargo about cannot read, or
      # one that notices/by-hand.toml no longer matches.
      - run: make notices

  # The tests on macOS, in the default build only. Formatting, lints,
  # licences and the build without default features do not depend on the
  # system, so the Linux job alone checks them.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # All the tests, so that one run shows every failure.
      - run: cargo nextest run --workspace --no-fail-fast
