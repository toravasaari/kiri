name: check

# Runs `make check`, the definition of done, on every push to master, on
# pull requests, and by hand from the Actions tab. A push to a feature branch
# alone does not run it; opening a pull request does.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml and installs rustfmt and clippy.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # `make test` uses cargo-nextest, and `make check` runs the licence check
      # with cargo-deny, when they are installed.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-about
      - run: make check
      # The third-party notices of a release must be makeable: this fails when
      # a dependency brings a licence file that cargo about cannot read, or
      # one that notices/by-hand.toml no longer matches.
      - run: make notices
