# Read by `cargo about`, which `make notices` runs to find the licences of
# the Rust libraries kiri is built from (as JSON, which crates/kiri-tr-notices
# turns into the notices).
#
# `accepted` is a list in priority order: a library with `MIT OR Apache-2.0`
# gets the first of them it finds, so the shorter MIT text. It is the same
# list as `allow` in deny.toml; add a licence to both, after reading it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "EPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]

# What the release binaries are built for.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

# kiri's own crates are not third-party.
private = { ignore = true }
